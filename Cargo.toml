[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "A Windows control centre for input devices, audio and displays (Razer, Xbox, DDC/CI monitors)"
license = "GPL-3.0-or-later"
repository = "https://github.com/DDQW/HIDConfig"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
