[package]
name = "hidconfig"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
hidconfig-hid = { path = "../../crates/hidconfig-hid" }
hidconfig-proto = { path = "../../crates/hidconfig-proto" }
hidconfig-settings = { path = "../../crates/hidconfig-settings" }
hidconfig-win = { path = "../../crates/hidconfig-win" }
rfd = "0.17.2"
slint = "1.18.1"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.100.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
